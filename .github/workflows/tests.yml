
name: Testes automatizados de QA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Instalar Playwright
        run: python -m pip install pytest-playwright

      - name: Instalar navegador Chromium
        run: python -m playwright install --with-deps chromium

      - name: Executar testes funcionais e de API
        run: python -m pytest -v

      - name: Executar testes de interface
        run: python -m pytest tests/test_ui.py -v
